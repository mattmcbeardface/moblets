plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
}

base {
    archivesName = 'moblets-neoforge'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDir rootProject.file('common/src/main/java')
        java.srcDir rootProject.file('common/src/client/java')
        resources.srcDir rootProject.file('common/src/main/resources')
    }
}

neoForge {
    version = project.neoforge_version

    mods {
        "baby_mobs" {
            sourceSet(sourceSets.main)
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "neoforge_version", project.neoforge_version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            neoforge_version: project.neoforge_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = "${project.version}+mc${project.minecraft_version}"
}
